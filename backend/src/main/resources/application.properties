spring.application.name=ajedrez-api

# Base de datos (en Docker llegan por variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ajedrez?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:ajedrez}
spring.datasource.password=${DB_PASSWORD:ajedrez}

# El esquema lo maneja Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Seguridad
app.jwt.secret=${JWT_SECRET:dev-secreto-solo-para-desarrollo-cambiar-0123456789}
app.jwt.horas=8
app.admin.email=${ADMIN_EMAIL:admin@fba.bo}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# Swagger UI en /ajedrez/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

logging.level.bo.utb.ajedrez=INFO
